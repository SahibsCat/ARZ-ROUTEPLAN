services:
  # FastAPI backend
  - type: web
    name: rootplan-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # your Neon connection string - set in the Render dashboard, never committed
      - key: GEOCODING_PROVIDER
        value: google
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # set to the frontend's Render URL once it exists (see DEPLOY_RENDER.md); "*" until then

  # React (Vite) frontend, built as a static site
  - type: web
    name: rootplan-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # the backend service's Render URL, e.g. https://rootplan-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
